/* Layout: Feste Bühne 1920×1080 (16:9), die als Ganzes auf jedes Fenster skaliert wird.
   Links die Cartoon-Welt mit Anzeigeleiste, rechts die Textfläche. Die Startseite für Lehrkräfte und die Wahlurne
   sind eigene, mitwachsende Seiten. Helles Farbschema "Minzhauch" mit Spielkarten-Stil:
   Karten, Buttons und Badges haben 2 px Kontur in Tinte, harten Schatten 4 px nach rechts unten und 10 px Rundung.
   Fließtext und Hintergrundflächen bekommen nie Kontur oder Schatten. */
:root{
  --page:#E8F5EF; --panel:#FFFFFF; --tint:#F2F8F5; --tint-2:#E3EFE9; --ink:#1E2140; --muted:#4B4F72; --soft:#B9C7C1;
  --acc:#FFC93C; --on-acc:#1E2140; --bad:#C42F4B; --ok:#2BB673; --mid:#FFC93C; --no:#E5484D; --idea:#B79CF2;
  --c-mehrheit:#3A6FD8; --c-konsens:#128A5E; --c-widerstand:#D9622B; --c-vertretung:#7A4FD0;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bd:2px solid var(--ink); --sh:4px 4px 0 var(--ink); --r:10px;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-weight:400;line-height:1.45}
body.game{overflow:hidden}
h1,h2,h3{margin:0;font-weight:800;line-height:1.1;text-wrap:balance;font-family:var(--display)}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em}
b,strong{font-weight:600}
button{font:inherit;cursor:pointer;line-height:1.2;color:inherit}
:focus-visible{outline:3px solid var(--c-mehrheit);outline-offset:3px}

/* ---------- Spielkarten-Stil ---------- */
.card{background:var(--panel);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh)}

/* ---------- Bühne ---------- */
#game{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--k,1));transform-origin:center center;
  display:grid;grid-template-rows:96px 924px;row-gap:12px;padding:24px;box-sizing:border-box;font-size:21px;overflow:hidden;background:var(--page)}
.topbar{display:grid;grid-template-columns:330px minmax(0,1fr) auto;align-items:center;gap:28px;position:relative}
.brand{display:flex;align-items:center;gap:14px}
.brand .name{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;letter-spacing:-.025em;color:var(--ink)}
.brand .sub{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);line-height:1.15;letter-spacing:-.01em}
.logo{width:60px;height:60px;border-radius:var(--r);background:var(--acc);border:var(--bd);box-shadow:var(--sh);display:grid;place-items:center;flex:none;box-sizing:border-box}
.logo svg{width:40px;height:40px}
.tools{display:flex;gap:12px;align-items:center}
.ask{display:flex;gap:10px;align-items:center;font-weight:600}
.tb-step,.tb-note{font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted);text-align:center}
.tb-step b,.tb-note b{color:var(--ink);background:var(--acc);border:var(--bd);border-radius:var(--r);padding:0 10px;box-shadow:3px 3px 0 var(--ink)}
.main{display:grid;grid-template-columns:820px 1028px;column-gap:24px;position:relative}
.leftcol{display:grid;grid-template-rows:796px 112px;row-gap:16px}

/* Linienplan */
.route ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.route ol::before,.route ol::after{content:"";position:absolute;top:14px;left:7.14%;height:4px}
.route ol::before{right:7.14%;background:var(--soft)}
.route ol::after{width:calc((100% - 14.28%) * var(--p,0));background:var(--ink);transition:width .9s cubic-bezier(.5,0,.2,1)}
.route li{position:relative;text-align:center;padding-top:40px;line-height:1.05;padding-inline:3px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);letter-spacing:-.01em}
.route .dot{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--panel);border:var(--bd);z-index:1;box-sizing:border-box;transition:all .4s}
.route li.done .dot{background:var(--ink)}
.route li.done{color:var(--ink)}
.route li.now .dot{background:var(--acc);width:36px;height:36px;top:-2px;box-shadow:3px 3px 0 var(--ink);animation:dotpulse 1.6s ease-in-out infinite}
@keyframes dotpulse{50%{transform:translateX(-50%) scale(1.12)}}
.route li.now{color:var(--ink);font-weight:800}

/* Knöpfe */
.btn{position:relative;min-height:54px;padding:8px 22px;border:var(--bd);border-radius:var(--r);background:var(--ink);color:#FFFFFF;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;box-shadow:var(--sh);transition:transform .1s ease,box-shadow .1s ease;box-sizing:border-box}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none;transition-duration:.04s}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.gelb{background:var(--acc);color:var(--on-acc)}
.btn.warn{background:var(--panel);color:var(--bad)}
.btn.sm{min-height:46px;padding:4px 14px;font-size:20px}
.btn.huge{min-height:90px;padding:14px 48px;font-size:40px;font-weight:800}
.btn.pulse{animation:nudge 2.4s ease-in-out infinite}
.btn.pulse:hover,.btn.pulse:active{animation:none}
@keyframes nudge{0%,100%{transform:none}50%{transform:translate(-1px,-2px)}}
button:disabled{opacity:.4;cursor:not-allowed}
.btn.plan{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;padding:3px 14px;line-height:1.05;min-width:150px}
.btn.plan .pl1{font-size:19px;font-weight:800}
.btn.plan .pl2{font-family:var(--body);font-size:14px;font-weight:600}
.btn.plan.ok{background:#DDF5E9;color:var(--ink)} .btn.plan.early{background:#E3ECFB;color:var(--ink)}
.btn.plan.warn{background:var(--acc);color:var(--ink)} .btn.plan.late{background:#FCE3E8;color:#7A1428}

/* Welt */
.world{position:relative;width:820px;height:796px;box-sizing:border-box;border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;background:#7CC242}
.world canvas{display:block;position:absolute;left:-2px;top:-12px;width:820px;height:820px}
.overlay{position:absolute;left:-2px;top:-12px;width:820px;height:820px;pointer-events:none}
.sign{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px;background:#FFFFFF;border:var(--bd);border-radius:var(--r);padding:3px 14px 3px 4px;
  font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;max-width:340px;box-sizing:border-box;box-shadow:var(--sh);animation:signin .5s cubic-bezier(.3,1.6,.5,1) both}
.sign:nth-child(2){animation-delay:.08s}.sign:nth-child(3){animation-delay:.16s}.sign:nth-child(4){animation-delay:.24s}.sign:nth-child(5){animation-delay:.32s}
@keyframes signin{from{opacity:0;scale:.6}}
.sign .sl{width:32px;height:32px;flex:none;display:grid;place-items:center;background:var(--acc);border-radius:7px;font-size:21px;font-weight:800;color:var(--ink)}
.sign.idea .sl{background:var(--idea)}
.sign .st{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sign.dim{opacity:.5}
.sign .sc{background:var(--rc);color:#FFFFFF;border-radius:6px;padding:0 8px;font-weight:800;margin-left:2px;flex:none}
.tag{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#FFFFFF;border-radius:999px;padding:1px 12px;font-family:var(--display);font-weight:700;font-size:20px;white-space:nowrap;box-shadow:0 0 0 2px #FFFFFF}
.plabel{position:absolute;transform:translate(-50%,-100%);background:var(--rc,var(--ink));color:#FFFFFF;padding:2px 12px;border-radius:var(--r);font-family:var(--display);font-weight:800;font-size:22px;border:var(--bd);box-shadow:3px 3px 0 var(--ink);animation:signin .4s both;white-space:nowrap}
.tlabel{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:22px;color:#FFFFFF;text-shadow:0 2px 0 #3B2370}
.wcap{position:absolute;left:16px;bottom:24px;background:var(--panel);color:var(--ink);border:var(--bd);border-radius:var(--r);box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-weight:700;font-size:20px;padding:3px 14px}

/* Anzeigeleiste unter der Welt */
.hudbar{display:grid;grid-template-columns:156px 172px 176px minmax(0,1fr);gap:12px;padding-right:4px}
.hudbar .cell:last-child{padding:8px 8px}
.cell{background:var(--panel);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:8px 14px;display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;box-sizing:border-box}
.label{font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
.big{font-family:var(--display);font-weight:800;font-size:31px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.big small{font-size:17px;color:var(--muted);font-weight:700}
.big.neg{color:var(--bad)}
.meter{height:10px;background:var(--tint-2);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:5px;transition:width .8s cubic-bezier(.5,0,.2,1)}
#timer-cell{background:var(--acc)}
#timer-cell .label{color:var(--ink)}
.cell.alarm,.ch-timer.alarm{background:var(--bad)!important;color:#FFFFFF}
.cell.alarm .label,.ch-timer.alarm .label{color:#FFFFFF}
.cell.alarm .big,.ch-timer.alarm .big{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.cell.bump-pos{animation:bump .7s ease}.cell.bump-pos .big{color:var(--c-konsens)}
.cell.bump-neg{animation:bump .7s ease}.cell.bump-neg .big{color:var(--bad)}
@keyframes bump{30%{transform:scale(1.06)}}
.timerow{display:flex;align-items:center;justify-content:space-between;gap:6px}
.timerow .btn.sm{min-height:36px;padding:2px 9px;font-size:16px;box-shadow:2px 2px 0 var(--ink)}
.tix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px;margin-top:3px}
.tk{display:flex;justify-content:space-between;gap:4px;align-items:center;padding:2px 3px 2px 6px;border-radius:7px;background:var(--rc);color:#FFFFFF;font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden}
.tk b{min-width:22px;height:22px;border-radius:5px;display:grid;place-items:center;background:#FFFFFF;color:var(--ink);font-size:15px;font-weight:800}
.tk.used{background:var(--tint-2);color:var(--muted);text-decoration:line-through}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* Textfläche rechts */
.panel{width:1028px;height:920px;box-sizing:border-box;background:var(--panel);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;position:relative}
.pbody{height:100%;box-sizing:border-box;overflow:hidden;padding:26px 34px 28px;display:flex;flex-direction:column;gap:16px;font-size:calc(21px * var(--pfs,1))}
.pbody.scroll{overflow:auto}
.pbody.enter > *{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.pbody.enter > *:nth-child(2){animation-delay:.05s}.pbody.enter > *:nth-child(3){animation-delay:.1s}.pbody.enter > *:nth-child(4){animation-delay:.15s}
.pbody.enter > *:nth-child(5){animation-delay:.2s}.pbody.enter > *:nth-child(6){animation-delay:.25s}.pbody.enter > *:nth-child(n+7){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}

.kicker{font-family:var(--display);font-weight:700;font-size:1em;color:var(--muted);letter-spacing:-.005em}
.kicker .rb{display:inline-block;background:var(--rc);color:#FFFFFF;border:var(--bd);border-radius:var(--r);padding:0 10px;margin-left:6px;box-shadow:3px 3px 0 var(--ink)}
.title{font-family:var(--display);font-weight:800;font-size:max(40px,2.05em);letter-spacing:-.025em;color:var(--ink);line-height:1.05}
.title.sm{font-size:40px}
.title.pop{animation:pop .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.lead{font-size:1.05em}
.facts{background:var(--tint);border-radius:var(--r);padding:10px 16px}
.facts h3{font-size:1.05em;margin-bottom:3px}
.olist{display:grid;gap:14px}
.olist.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 14px;padding:10px 14px;border-radius:var(--r);background:var(--panel);color:var(--ink);text-align:left;align-items:start;border:var(--bd);box-shadow:var(--sh);transition:transform .1s,box-shadow .1s}
button.opt:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
button.opt:active{transform:translate(2px,2px);box-shadow:none}
.opt .letter{grid-row:span 3}
.letter{width:40px;height:40px;border-radius:8px;background:var(--acc);color:var(--ink);border:var(--bd);font-family:var(--display);font-weight:800;font-size:24px;display:grid;place-items:center;flex:none;box-sizing:border-box}
.letter.idea{background:var(--idea)}
.opt b{font-family:var(--display);font-weight:700;font-size:1.05em;letter-spacing:-.01em}
.opt .desc{color:var(--muted)}
.opt .cost{white-space:nowrap;font-style:normal;font-weight:600;color:var(--ink);background:var(--tint-2);border-radius:6px;padding:0 6px}
.opt.win{background:#FFF6DA}
.opt.tried{opacity:.5}
.opt .tag2{font-weight:600;color:var(--bad)}
.opt .del{justify-self:start;min-height:34px;padding:2px 12px;font-size:1em;background:var(--panel);border:var(--bd);border-radius:8px;color:var(--ink)}
.own{display:flex;flex-direction:column;gap:6px}
.own label{font-weight:600}
.own-row{display:flex;gap:12px}
.own-row input{flex:1 1 auto;min-width:0;font:inherit;padding:8px 14px;border-radius:var(--r);border:var(--bd);background:var(--panel);color:var(--ink)}
.own-row input::placeholder{color:#7A7E9C}
.note{padding:10px 16px;border-radius:var(--r);background:var(--tint)}
.note.bad{background:#FCE8EC;color:#7A1428}
.note.okk{background:var(--tint)}
.note.big-note{font-size:1.05em;font-weight:600}
.shake{animation:shake .45s ease}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.actions{display:flex;flex-wrap:wrap;gap:16px;align-items:center;padding-top:4px}
details.tips{border-top:2px dashed var(--soft);padding-top:8px}
details.tips summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.tips p{margin-top:6px;color:var(--muted)}
.small{font-size:1em;color:var(--muted)}
.muted{color:var(--muted)}

.vote-rows{display:grid;gap:9px}
.vrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:7px 12px;border-radius:var(--r);background:var(--tint)}
.vt{font-weight:600;display:flex;flex-direction:column;gap:6px;min-width:0}
.swatch{width:40px;height:40px;border-radius:8px;flex:none;border:var(--bd);box-sizing:border-box}
.sw-ok{background:var(--ok)} .sw-mid{background:var(--mid)} .sw-bad{background:var(--no)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{min-width:46px;height:46px;padding:0 6px;border-radius:8px;border:var(--bd);font-family:var(--display);font-size:24px;font-weight:800;background:var(--panel);color:var(--ink);box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.stepper button:active{transform:translate(2px,2px);box-shadow:none}
.stepper input{width:72px;height:46px;box-sizing:border-box;text-align:center;font-family:var(--display);font-size:28px;font-weight:800;padding:0;border-radius:8px;border:var(--bd);background:var(--panel);color:var(--ink)}
.wbar{display:block;height:10px;background:var(--tint-2);border-radius:5px;overflow:hidden}
.wbar i{display:block;height:100%;background:var(--c-widerstand);border-radius:5px;transition:width .4s}
.sumline{font-variant-numeric:tabular-nums;color:var(--muted)}
.sumline b{color:var(--ink)}
.chips-sel{display:flex;flex-wrap:wrap;gap:10px}
.team{border:var(--bd);border-radius:var(--r);background:var(--panel);color:var(--ink);font-family:var(--display);font-weight:700;padding:6px 16px;display:inline-flex;align-items:center;gap:8px;min-height:46px;box-shadow:var(--sh);transition:transform .1s,box-shadow .1s;box-sizing:border-box}
.team:active{transform:translate(2px,2px);box-shadow:none}
.team.on{background:var(--ink);color:#FFFFFF}
.team.static{cursor:default;box-shadow:none}
.team .tdot{width:16px;height:16px;border-radius:50%;display:inline-block;border:2px solid var(--ink)}
.setline{display:flex;align-items:center;gap:14px}
.setline .val{font-family:var(--display);font-size:36px;font-weight:800;min-width:54px;text-align:center}

/* Regelkarten als Fahrkarten */
.forms-grid,.formpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.ticket{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;background:var(--panel);color:var(--ink);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);overflow:visible;transition:transform .1s,box-shadow .1s}
button.ticket:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
button.ticket:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.tk-head{background:var(--rc);color:#FFFFFF;border-radius:8px 8px 0 0;padding:10px 18px 9px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tk-name{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em}
.tk-sub{font-family:var(--display);font-weight:700;font-size:20px;opacity:.9;white-space:nowrap}
.tk-cut{position:relative;height:0;border-top:2px dashed var(--ink)}
.tk-cut::before,.tk-cut::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--page);border:var(--bd);box-sizing:border-box}
.panel .tk-cut::before,.panel .tk-cut::after,.full .tk-cut::before,.full .tk-cut::after{background:var(--panel)}
.tk-cut::before{left:-11px;clip-path:inset(0 0 0 50%)}
.tk-cut::after{right:-11px;clip-path:inset(0 50% 0 0)}
.tk-body{padding:12px 18px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.tk-body p{font-size:1em}
.badge{align-self:flex-start;display:inline-block;background:var(--acc);color:var(--ink);border:var(--bd);border-radius:8px;box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:20px;padding:1px 10px}
.badge.off{background:var(--tint-2);color:var(--muted);box-shadow:none;text-decoration:line-through}
.ticket:disabled{opacity:.45}
.pm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pm ul{list-style:none;padding:0}
.pm li{padding-left:1em;text-indent:-1em}
.pm .plus li::before{content:"+ ";color:var(--c-konsens);font-weight:800}
.pm .minus li::before{content:"− ";color:var(--bad);font-weight:800}

.chips{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 14px;border-radius:var(--r);background:var(--panel);border:var(--bd);box-shadow:3px 3px 0 var(--ink);font-family:var(--display);font-weight:800;font-size:1.05em}
.chip.pos{background:#DDF5E9} .chip.neg{background:#FCE3E8}
.recht{border-radius:var(--r);padding:12px 18px;display:flex;flex-direction:column;gap:5px;background:#FFF6DA}
.recht .art{font-family:var(--display);font-weight:800;color:var(--ink)}
.recht .rfrage{font-weight:600}
.refl h3{font-size:1.15em;margin-bottom:5px}
.refl li+li{margin-top:3px}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.rank{display:grid;gap:8px}
.rank .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.rank .pts{font-family:var(--display);font-weight:800;font-size:1.2em}
.pm-toggle{align-self:flex-start;background:var(--panel);border:0;border-bottom:2px dashed var(--ink);padding:0 0 2px;font-weight:600;color:var(--ink)}

/* Abschluss */
.fchart{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:230px minmax(0,1fr) 230px 72px;gap:14px;align-items:center}
.frow .meta b{font-family:var(--display);font-weight:800;display:block;line-height:1.1}
.frow .rbx{display:inline-block;background:var(--rc);color:#FFFFFF;border-radius:6px;padding:0 8px;font-family:var(--display);font-weight:700;font-size:1em}
.frow .dec{color:var(--muted);line-height:1.25}
.frow .dz{font-family:var(--display);font-weight:800;text-align:right}
.fbar{display:flex;height:28px;border-radius:7px;overflow:hidden;background:var(--tint-2);border:var(--bd)}
.fbar i{display:block;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.fbar .g{background:var(--ok)} .fbar .m{background:var(--mid)} .fbar .s{background:var(--no)}
.fbar.empty{border-style:dashed}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:18px;height:18px;border-radius:4px;display:inline-block;border:2px solid var(--ink)}

/* Ganze Bühne: Spieltitel, Themenwahl, Nachdenken, Aufhänger */
.full{height:920px;box-sizing:border-box;background:var(--panel);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:34px 52px;display:flex;flex-direction:column;gap:20px;font-size:23px;overflow:hidden;position:relative}
.full.enter > *{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.full.enter > *:nth-child(2){animation-delay:.07s}.full.enter > *:nth-child(3){animation-delay:.14s}.full.enter > *:nth-child(n+4){animation-delay:.21s}
.full .title{font-size:54px}
.full .lead{font-size:25px;color:var(--muted)}
.gt{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 760px;gap:40px;align-items:center;min-height:0}
.gt-l{display:flex;flex-direction:column;gap:24px}
.gt .ht{font-family:var(--display);font-weight:800;font-size:150px;line-height:.92;letter-spacing:-.04em;color:var(--ink)}
.gt .hsub{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.025em;color:var(--ink)}
.gt .hsub span{background:var(--acc);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:0 14px;display:inline-block}
.gt .hp{font-size:27px;line-height:1.4;max-width:30em}
.gt .hp b{font-weight:600}
.gt-r{display:grid;grid-template-columns:repeat(2,330px);gap:40px 44px;justify-content:center;align-content:center}
.gt-r canvas{width:330px;height:330px;border-radius:var(--r);border:var(--bd);box-shadow:var(--sh);transform:rotate(var(--r2));animation:bob 5s ease-in-out var(--d) infinite;box-sizing:border-box}
@keyframes bob{50%{transform:rotate(var(--r2)) translateY(-10px)}}
.ch-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:end}
.ch-timer{background:var(--acc);border:var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:10px 18px;display:flex;flex-direction:column;gap:6px;min-width:250px}
.ch-timer .label{color:var(--ink)}
.ch-timer .big{font-size:60px}
.ccards{display:grid;gap:24px;flex:1;min-height:0}
.ccards.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.ccards.n3{grid-template-columns:repeat(3,minmax(0,1fr))}.ccards.n4{grid-template-columns:repeat(4,minmax(0,1fr))}
.ccard{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;text-align:center;padding:20px 18px;border-radius:var(--r);border:var(--bd);background:var(--panel);color:var(--ink);box-shadow:var(--sh);transition:transform .1s,box-shadow .1s,background .2s;min-height:0}
.ccard:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.ccard:active{transform:translate(2px,2px);box-shadow:none}
.ccard canvas{width:250px;height:250px;border-radius:var(--r);border:var(--bd);flex:none;box-sizing:border-box}
.ccard .sn{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.ccard .cp{font-size:20px;color:var(--muted);line-height:1.4}
.ccard.on,.ccard.spin{background:#FFF6DA;box-shadow:8px 8px 0 var(--ink);transform:translate(-3px,-3px)}
.ccard.on .sn,.ccard.spin .sn{background:var(--acc);border-radius:6px;padding:0 8px}
.how{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:56px;align-items:center;min-height:0}
.how-l{display:flex;flex-direction:column;gap:22px}
.how .title{font-size:48px}
.q h3{font-size:30px;margin-bottom:12px;letter-spacing:-.015em}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.howlist{display:grid;gap:12px}
.pick{min-height:62px;border-radius:var(--r);border:var(--bd);background:var(--panel);color:var(--ink);font-family:var(--display);font-weight:700;font-size:26px;box-shadow:var(--sh);transition:transform .1s,box-shadow .1s}
.pick:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.pick:active{transform:translate(2px,2px);box-shadow:none}
.pick.on{background:var(--ink);color:#FFFFFF}
.pick.wide{text-align:left;font-family:var(--body);font-weight:600;font-size:22px;min-height:56px;padding:8px 20px}
.how-r canvas{width:420px;height:420px;border-radius:var(--r);border:var(--bd);box-shadow:var(--sh);--r2:3deg;transform:rotate(3deg);animation:bob 5s ease-in-out infinite;box-sizing:border-box}
.hook{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;max-width:1380px;margin:0 auto}
.hk-t{font-family:var(--display);font-weight:800;font-size:96px;line-height:1;letter-spacing:-.035em;color:var(--ink);animation:pop .7s cubic-bezier(.3,1.7,.5,1) both}
.hk-l{font-size:28px;line-height:1.4}
.hk-l b{font-weight:600}
.hook .ticket{max-width:900px}
.hook .tk-body{font-size:24px}
.hk-none{border-radius:var(--r);padding:18px 24px;background:#FCE8EC;font-size:24px;display:flex;flex-direction:column;gap:6px}
.hk-none .hk-rn{font-family:var(--display);font-weight:800;font-size:40px;color:var(--bad);letter-spacing:-.02em}

/* Intro-Animation (Ablauf unverändert, Farben an das neue Schema angepasst) */
.intro{position:absolute;inset:0;z-index:60;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.i-wipe{position:absolute;inset:0;background:var(--ink);clip-path:circle(0% at 50% 55%);animation:wipe .75s cubic-bezier(.7,0,.25,1) forwards}
@keyframes wipe{to{clip-path:circle(150% at 50% 55%)}}
.intro.out .i-wipe{animation:wipeout .7s cubic-bezier(.7,0,.25,1) forwards}
@keyframes wipeout{from{clip-path:circle(150% at 50% 55%)}to{clip-path:circle(0% at 50% 45%)}}

/* ================= Hilfen ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const L = i => "ABCDE"[i];
const sum = a => a.reduce((x,y)=>x+y,0);
const zeros = n => Array(n).fill(0);
const clamp = (v,lo,hi) => Math.min(hi,Math.max(lo,v));
const mmss = s => { s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

/* ================= Zustand ================= */
let S, U;
function fresh(keep){
  keep=keep||{};
  return {screen:"teacher", prev:null, sc:keep.sc||0, mode:keep.mode||"einzeln", n:keep.n||24, groups:keep.groups||[], budget:600, zus:60, round:0, phase:"situation",
    forms:{mehrheit:2,konsens:1,widerstand:1,vertretung:1}, extra:[], form:null, v:null, result:null,
    feel:{gut:0,mittel:0,schlecht:0}, history:[], timer:{total:240,elapsed:0,since:0,running:false,used:0},
    last:null, evDone:false, ask:null, fs:keep.fs||1,
    allowed:keep.allowed||SCENARIOS.map(()=>true), pm:false, planOn:!!keep.planOn, t0:null, disc:{total:180,elapsed:0,since:0,running:false,started:false}, allowErr:false, chosen:false, ent:{easy:null,how:null,rand:false},
    ct:{total:120,elapsed:0,since:0,running:false,over:false}};
}
function freshUrne(n){ return {kind:"auswahl", nOpt:4, n:n||24, stage:"setup", counts:[], sel:null, wsel:[], given:0}; }

const SC = () => SCENARIOS[S.sc];
const RS = () => SC().rounds;
const R = () => RS()[S.round];
const voters = () => S.n;
const kmax = () => Math.max(1, Math.min(7, voters()-1));
const repCount = () => S.mode==="gruppen" ? S.v.reps.length : S.v.k;
const unitWho = () => S.mode==="gruppen" ? "Gruppen" : "Personen";
function makeGroups(){ S.groups = S.mode==="gruppen" ? shuffle(TEAMS.map((t,i)=>i)).slice(0,S.n) : []; }
const teamName = g => TEAMS[S.groups[g]];
const teamCol = g => TEAMCOL[S.groups[g]];
function opts(){
  return R().options.concat(S.extra.map(t=>({t, s:t, d:"Euer eigener Vorschlag.", cost:0, zus:2, own:true, sp:"in",
    folge:"Ihr setzt euren eigenen Vorschlag um: „" + t + "“."})));
}
function maxFor(key){
  const N=voters();
  if(key==="sums") return 5*N;
  if(key==="counts") return S.form==="vertretung" ? repCount() : N;
  if(key==="k") return kmax();
  return N;
}
function elapsed(){ const t=S.timer; return t.elapsed + (t.running ? (Date.now()-t.since)/1000 : 0); }
const tLeft = t => t.total - (t.elapsed + (t.running ? (Date.now()-t.since)/1000 : 0));
const discTime = r => r.time>=240 ? 180 : r.time>=180 ? 120 : 60;
function stopDisc(){ const t=S.disc; if(t.running){ t.elapsed+=(Date.now()-t.since)/1000; t.running=false; } }
function resetTimer(){ S.timer={total:R().time, elapsed:0, since:0, running:false, used:0}; }
function stopTimer(){ S.timer.elapsed=elapsed(); S.timer.used=S.timer.elapsed; S.timer.running=false; }
function resetRound(){
  S.phase="situation"; S.extra=[]; S.form=null; S.v=null; S.result=null;
  S.feel={gut:0,mittel:0,schlecht:0}; S.evDone=false; S.last=null; resetTimer();
  S.disc={total:discTime(R()), elapsed:0, since:0, running:false, started:false};
}
function pickForm(f){
  if(!S.forms[f]) return;
  stopDisc();
  const n=opts().length;
  S.form=f;
  S.v = f==="mehrheit" ? {counts:zeros(n)}
      : f==="widerstand" ? {sums:zeros(n)}
      : f==="konsens" ? {prop:null, zu:0, be:0, veto:0, blocked:false, tries:[]}
      : {stage:"pick", k:Math.min(3,kmax()), reps:[], counts:zeros(n)};
  S.phase="vote"; resetTimer(); S.timer.running=true; S.timer.since=Date.now();
}
function finish(res){
  stopTimer();
  S.forms[S.form]--;
  S.result=Object.assign({used:S.timer.used}, res);
  S.phase="result";
}
function evaluate(){
  const v=S.v, N=voters();
  if(S.form==="mehrheit" || S.form==="vertretung"){
    const c=v.counts, tot=sum(c), cap = S.form==="vertretung" ? repCount() : N;
    if(!tot){ v.err="Tragt zuerst die Stimmen ein."; return; }
    if(tot>cap){ v.err="Es sind "+tot+" Stimmen eingetragen, aber nur "+cap+(S.form==="vertretung"?" in der Vertretung":" stimmberechtigt")+". Bitte prüfen."; return; }
    const mx=Math.max(...c), w=c.map((x,i)=>x===mx?i:-1).filter(i=>i>=0);
    if(w.length>1){ v.err="Gleichstand zwischen "+w.map(L).join(" und ")+". Stimmt nur zwischen diesen Vorschlägen noch einmal ab und tragt das neue Ergebnis ein."; return; }
    finish({idx:w[0], votes:mx, total:tot, gegen:tot-mx});
  } else if(S.form==="widerstand"){
    const s=v.sums;
    if(!sum(s)){ v.err="Tragt zuerst die Widerstandspunkte ein."; return; }
    const mn=Math.min(...s), w=s.map((x,i)=>x===mn?i:-1).filter(i=>i>=0);
    if(w.length>1){ v.err="Gleichstand: "+w.map(L).join(" und ")+" haben gleich wenig Widerstand. Bewertet nur diese Vorschläge noch einmal."; return; }
    finish({idx:w[0], points:mn, sums:s.slice()});
  } else if(S.form==="konsens"){
    if(v.prop==null){ v.err="Wählt zuerst einen Vorschlag aus."; return; }
    const tot=v.zu+v.be+v.veto;
    if(!tot){ v.err="Tragt ein, wie viele Karten in jeder Farbe gezeigt wurden."; return; }
    if(tot>N){ v.err="Es sind "+tot+" Karten eingetragen, aber nur "+N+" stimmberechtigt. Bitte prüfen."; return; }
    if(v.veto>0){ v.blocked=true; return; }
    finish({idx:v.prop, zu:v.zu, be:v.be, gegen:0, total:tot});
  }
}
function applyResult(){
  const r=S.result, o=opts()[r.idx], f=S.feel, fs=f.gut+f.mittel+f.schlecht;
  const fd = fs ? Math.round(((f.gut - 1.5*f.schlecht)/fs)*10) : 0;
  const nd = r.none ? -10 : 0;
  const dz = o.zus + fd + nd;
  S.budget += o.cost;
  S.zus = clamp(S.zus + dz, 0, 100);
  S.history.push({stop:R().stop, idx:r.idx, form:S.form, none:!!r.none, opt:o.t, letter:L(r.idx), used:r.used, limit:S.timer.total,
    feel:{gut:f.gut,mittel:f.mittel,schlecht:f.schlecht}, gegen:r.gegen, total:r.total, dz});
  S.last={o, dz, fd, nd, base:o.zus};
  S.phase="check";
}
function advance(){
  S.round++;
  if(S.round>=RS().length){ S.screen="end"; return; }
  resetRound();
}

  return `<div class="stepper">${wide?b(-5,"−5","5 weniger"):""}${b(-1,"−","1 weniger")}<input id="in-${base}" type="number" inputmode="numeric" min="0" max="${max}" value="${val}" data-scope="${scope}" data-key="${key}" data-i="${i}" aria-label="Anzahl">${b(1,"+","1 mehr")}${wide?b(5,"+5","5 mehr"):""}</div>`;
}

  return act ? `<button type="button" class="opt ${cls||""}" data-act="${act}" data-i="${i}">${inner}</button>`
             : `<div class="opt ${cls||""}">${inner}</div>`;
}

/* Zeitplan: 90 Minuten. Einstieg bis Minute 10, Regeln bis 20, je Station 11 Minuten, Abschluss ab 75. */
const PHASE_FRAC={situation:0, form:.35, vote:.45, result:.7, feel:.78, check:.85, event:.95};
function planInfo(){
  if(!S.t0) return null;
  const el=(Date.now()-S.t0)/60000;
  const pos = S.screen==="title"?0 : S.screen==="choose"?1 : S.screen==="how"?6 : S.screen==="hook"?8 : S.screen==="forms"?10
    : S.screen==="round" ? 20+11*(S.round+(PHASE_FRAC[S.phase]||0)) : S.screen==="end" ? 75 : 0;
  const d=Math.round(el-pos), left=Math.max(0,Math.round(90-el));
  const st = Math.abs(d)<2 ? "ok" : d>0 ? (d>=6?"late":"warn") : "early";
  const txt = st==="ok" ? "Im Plan" : d>0 ? d+" Min. hinter Plan" : (-d)+" Min. vor Plan";
  return {st, txt, left, el:Math.round(el)};
}
function planBtn(){
  if(!S.planOn) return `<button type="button" class="btn ghost sm" id="planBtn" data-act="plan" title="Zeigt, ob ihr im Zeitplan der 90-Minuten-Stunde liegt">Zeitplan</button>`;
  const p=planInfo()||{st:"ok",txt:"Im Plan",left:90,el:0};
  return `<button type="button" class="btn sm plan ${p.st}" id="planBtn" data-act="plan" title="Seit Spielstart ${p.el} Min. Antippen zum Ausblenden."><span class="pl1">${p.txt}</span><span class="pl2">${p.left} Min. bis Stundenende</span></button>`;
}
function stops(){ return ["Start"].concat(RS().map(r=>r.stop), [SC().lastStop]); }
function route(){
  const st=stops();
  const cur = S.screen==="title"||S.screen==="forms" ? 0 : S.screen==="end" ? st.length-1 : S.round+1;
  return `<nav aria-label="Spielverlauf"><ol style="--p:${(cur/(st.length-1)).toFixed(4)}">${st.map((s,i)=>`<li class="${i<cur?"done":i===cur?"now":""}" ${i===cur?'aria-current="step"':""}><span class="dot"></span>${esc(s).replace(/(Fußball|Kommen|Aus|Eröff|Nach|Wün)(platz|tare|stattung|nung|barin|sche)/,"$1&shy;$2")}</li>`).join("")}</ol></nav>`;
}
let hudPrev=null;
function hudBar(){
  const t=S.timer, inRound=S.screen==="round", inVote=inRound && S.phase==="vote", left=t.total-elapsed();
  let time;
  if(!inRound) time = `<span class="label">${S.screen==="end"?"Geschafft":"Stationen"}</span><div class="big">${S.history.length}<small> / ${RS().length}</small></div>`;
  else if(inVote) time = `<span class="label">Zeit</span><div class="timerow"><div class="big" id="timer-val">${mmss(left)}</div>
      <div class="row" style="gap:5px"><button type="button" class="btn ghost sm" data-act="timer-toggle" aria-label="${t.running?"Uhr anhalten":"Uhr weiterlaufen lassen"}">${t.running?"II":"▶"}</button><button type="button" class="btn ghost sm" data-act="timer-add" aria-label="Eine Minute mehr">+1</button></div></div>`;
  else if(S.phase==="situation"||S.phase==="form"){
    const dt=S.disc, dl=tLeft(dt);
    time = dt.started
      ? `<span class="label">Diskussion</span><div class="timerow"><div class="big" id="timer-val">${mmss(dl)}</div>
        <div class="row" style="gap:5px"><button type="button" class="btn ghost sm" data-act="disc-toggle" aria-label="${dt.running?"Uhr anhalten":"Uhr weiterlaufen lassen"}">${dt.running?"II":"▶"}</button><button type="button" class="btn ghost sm" data-act="disc-add" aria-label="Eine Minute mehr">+1</button></div></div>`
      : `<span class="label">Diskussion</span><div class="timerow"><div class="big">${mmss(dt.total)}</div><button type="button" class="btn ghost sm" data-act="disc-toggle" aria-label="Diskussionszeit starten">▶</button></div>`;
  }
  else time = `<span class="label">Gebraucht</span><div class="big">${mmss(t.used)}<small> / ${mmss(t.total)}</small></div>`;
  let bb="", bz="";
  if(hudPrev && hudPrev.sc===S.sc){ if(S.budget>hudPrev.b) bb="bump-pos"; else if(S.budget<hudPrev.b) bb="bump-neg"; if(S.zus>hudPrev.z) bz="bump-pos"; else if(S.zus<hudPrev.z) bz="bump-neg"; }
  hudPrev={b:S.budget,z:S.zus,sc:S.sc};
  return `<div class="cell ${bb}"><span class="label">${esc(SC().money.label)}</span><div class="big ${S.budget<0?"neg":""}">${euro(S.budget)}</div></div>
    <div class="cell ${bz}"><span class="label">Zusammenhalt</span><div class="big">${S.zus}<small> / 100</small></div><div class="meter" role="meter" aria-label="Zusammenhalt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${S.zus}"><i style="width:${S.zus}%"></i></div></div>
    <div class="cell ${(inVote&&left<=0)||(inRound&&(S.phase==="situation"||S.phase==="form")&&S.disc.started&&tLeft(S.disc)<=0)?"alarm":""}" id="timer-cell">${time}</div>
    <div class="cell"><span class="label">Fahrkarten</span><div class="tix">${Object.keys(FORMS).map(k=>`<span class="tk ${S.forms[k]?"":"used"}" style="--rc:${FORMS[k].col}" title="${FORMS[k].name}: noch ${S.forms[k]}"><span>${FORMS[k].kurz}</span><b>${S.forms[k]}</b></span>`).join("")}</div></div>`;
}

      ${v.blocked?`<p class="note bad big-note shake" role="alert">Veto! Dieser Vorschlag ist nicht beschlossen. Fragt, was die ${v.veto===1?"Person":"Personen"} mit Veto bräuchten, und versucht einen veränderten oder anderen Vorschlag.</p>`:""}`;

function resultView(){
  const res=S.result, O=opts(), o=O[res.idx], N=voters();

    return `<p class="kicker">Station ${S.round+1} · Keine Einigung</p>

  let detail="";
  if(S.form==="mehrheit"){
    detail = `<p class="lead"><b>${res.votes}</b> von ${res.total} Stimmen.</p>` +
      (res.gegen ? `<p class="note">${res.gegen} ${res.gegen===1?"Stimme war":"Stimmen waren"} für etwas anderes. Sie sind die Minderheit dieser Entscheidung und müssen jetzt mitgehen.</p>` : `<p class="note okk">Alle Stimmen gingen an diesen Vorschlag.</p>`);
  } else if(S.form==="vertretung"){
    const k=repCount();
    detail = `<p class="lead"><b>${res.votes}</b> von ${k} Stimmen der Vertretung.</p><p class="note">${N-k} ${unitWho()} haben nicht mitentschieden.</p>`;
  } else if(S.form==="konsens"){
    detail = `<p class="lead"><b>${res.zu}</b> grüne und <b>${res.be}</b> gelbe Karten, kein Veto.</p>` +
      (res.be ? `<p class="note">${res.be} mit Bedenken: Fragt nach, was helfen würde, damit die Bedenken kleiner werden.</p>` : "");
  } else if(S.form==="widerstand"){
    const mx=5*N, order=res.sums.map((p,i)=>({p,i})).sort((a,b)=>a.p-b.p);
    detail = `<p class="lead">Am wenigsten Widerstand: <b>${res.points}</b> Punkte von höchstens ${mx}.</p>

}

  <h2 class="title pop">${esc(e.title)}</h2>
  <p class="lead">${esc(e.text)}</p>

function endView(){
  const verdict = S.zus>=70 ? "Ihr seid als Gruppe zusammengewachsen." : S.zus>=45 ? "Ihr seid angekommen, mit ein paar Reibungen unterwegs." : "Viele fühlen sich übergangen. Was hätte anders laufen können?";
  const rows = S.history.map(h=>{
    const fs=h.feel.gut+h.feel.mittel+h.feel.schlecht, pc=x=>fs?(x/fs*100).toFixed(1):0;
    const seg=(n,c)=> n?`<i class="${c}" style="width:${pc(n)}%"></i>`:"";
    const bar = fs ? `<div class="fbar" role="img" aria-label="Gut ${h.feel.gut}, geht so ${h.feel.mittel}, gar nicht ${h.feel.schlecht}">${seg(h.feel.gut,"g")}${seg(h.feel.mittel,"m")}${seg(h.feel.schlecht,"s")}</div>`
      : `<div class="fbar empty" role="img" aria-label="kein Stimmungsbild"></div>`;
    return `<div class="frow"><div class="meta"><b>${esc(h.stop)}</b><span class="rbx" style="--rc:${FORMS[h.form].col}">${FORMS[h.form].kurz}</span></div>
      <div class="dec">${esc(h.opt)}${h.none?" (keine Einigung)":""}</div>${bar}<div class="dz">${h.dz>0?"+":""}${h.dz}</div></div>`;
  }).join("");
  return `<p class="kicker">${esc(SC().lastStop)}</p>
  <h2 class="title pop">${esc(SC().endTitle)}</h2>
  <p class="lead">${verdict}${S.budget<0?" Die "+esc(SC().money.label)+" ist im Minus, etwas muss gestrichen werden.":""}</p>
  <div class="refl"><h3>Eure Entscheidungen und wie sie sich angefühlt haben</h3>
    <div class="legend"><span><i style="background:var(--ok)"></i>gut</span><span><i style="background:var(--mid)"></i>geht so</span><span><i style="background:var(--no)"></i>gar nicht</span><span>Zahl rechts: Zusammenhalt</span></div>
    <div class="fchart" style="margin-top:10px">${rows}</div></div>
  <div class="refl"><h3>Zum Abschluss</h3><ul>
    <li>Welche Regel hat sich am fairsten angefühlt, und warum?</li>
    <li>Bei welcher Regel wurden stille Stimmen am meisten gehört?</li>
    <li>Wo könntet ihr eine dieser Regeln im Alltag nutzen?</li></ul></div>
  <div class="actions"><button type="button" class="btn" data-act="restart">Zur Startseite</button></div>`;
}

/* ================= Wahlurne ================= */
function uLabels(){
  if(U.kind==="konsens") return [["Zustimmung","ok"],["Bedenken","mid"],["Veto","bad"]];
  if(U.kind==="zufrieden") return [["Gut","ok"],["Geht so","mid"],["Gar nicht","bad"]];
  return zeros(U.nOpt).map((_,i)=>[L(i),""]);
}
function urneView(){
  const top=`<div class="urne-top"><span class="name">Wo lang? · Wahlurne</span><button type="button" class="btn ghost sm" data-act="from-urne">Zum Spiel</button></div>`;
  const kinds=[["auswahl","Auswahl","Eine Stimme für A, B, C …"],["widerstand","Widerstand","0 bis 5 Punkte für jeden Vorschlag"],["konsens","Konsens","Zustimmung, Bedenken oder Veto"],["zufrieden","Stimmungsbild","Gut, geht so oder gar nicht"]];
  const lab=uLabels();
  const card = inner => top + `<section class="card-solo">${inner}</section>`;
  if(U.stage==="setup"){
    const needOpt = U.kind==="auswahl"||U.kind==="widerstand";
    return card(`<h2 class="title">Geheim abstimmen</h2>
    <p class="lead">Gebt dieses Gerät herum. Jede Person tippt ihre Stimme, bestätigt und gibt das Gerät weiter. Das Ergebnis tragt ihr danach im Spiel ein.</p>
    <div><p class="label">Was wird abgestimmt?</p><div class="kindpick" style="margin-top:6px">${kinds.map(([k,n,d])=>`<button type="button" class="kind ${U.kind===k?"on":""}" data-act="u-kind" data-v="${k}"><b>${n}</b><br><span class="small">${d}</span></button>`).join("")}</div></div>
    ${needOpt?`<div class="setline"><span class="label">Anzahl Vorschläge</span><button type="button" id="u-o-m" class="btn ghost sm" data-act="u-nopt" data-d="-1" aria-label="weniger">−</button><span class="val">${U.nOpt}</span><button type="button" id="u-o-p" class="btn ghost sm" data-act="u-nopt" data-d="1" aria-label="mehr">+</button><span class="small">${zeros(U.nOpt).map((_,i)=>L(i)).join(", ")}</span></div>`:""}
    <div class="setline"><span class="label">Anzahl Stimmen</span><button type="button" id="u-n-m" class="btn ghost sm" data-act="u-n" data-d="-1" aria-label="weniger">−</button><span class="val">${U.n}</span><button type="button" id="u-n-p" class="btn ghost sm" data-act="u-n" data-d="1" aria-label="mehr">+</button></div>
    <p class="note okk">Die Wahlurne zählt nur. Sie merkt sich weder die Reihenfolge noch die Uhrzeit der Stimmen. So lässt sich nicht nachvollziehen, wer was gewählt hat. Nach dem Schließen ist alles weg.</p>
    <div class="actions"><button type="button" class="btn" data-act="u-open">Wahlurne öffnen</button></div>`);
  }
  const counter=`<p class="counter">${U.given} von ${U.n} Stimmen abgegeben</p>`;
  const reveal=txt=>`<button type="button" class="hold" data-hold="u-reveal">${txt}</button>`;
  if(U.stage==="vote"){
    let body;
    if(U.kind==="widerstand"){
      body = `<p class="lead">Wie stark ist dein Widerstand gegen jeden Vorschlag? 0 heißt: passt mir. 5 heißt: auf keinen Fall.</p>
      <div class="vote-rows">${zeros(U.nOpt).map((_,i)=>`<div class="wrow"><span class="letter">${L(i)}</span><div class="seg">${[0,1,2,3,4,5].map(p=>`<button type="button" class="${U.wsel[i]===p?"on":""}" data-act="u-w" data-i="${i}" data-v="${p}" aria-pressed="${U.wsel[i]===p}">${p}</button>`).join("")}</div></div>`).join("")}</div>
      <div class="actions"><button type="button" class="btn" data-act="u-wsubmit" ${U.wsel.every(x=>x!=null)?"":"disabled"}>Weiter</button></div>`;
    } else {
      body = `<p class="lead">Tippe auf deine Stimme.</p><div class="urne-opts">${lab.map(([t,c],i)=>`<button type="button" class="ubtn ${c} ${t.length>2?"txt":""}" data-act="u-pick" data-i="${i}">${esc(t)}</button>`).join("")}</div>`;
    }
    return card(`${counter}${body}
    <details class="tips"><summary>Für die Spielleitung</summary><p>Wenn nicht alle abstimmen, könnt ihr die Urne vorzeitig schließen. Haltet dazu den Knopf gedrückt.</p><div class="actions" style="margin-top:8px">${reveal("Gedrückt halten: Urne schließen")}</div></details>`);
  }
  if(U.stage==="confirm"){

  const sc=SCENARIOS[sci], r0=sc.rounds[0], off=document.createElement("canvas"); off.width=400; off.height=400;
  const c=off.getContext("2d"); if(!c) return null;
  const prev=g; g=c;
  c.setTransform(0.4,0,0,0.4,0,0); c.lineJoin="round"; c.lineCap="round";
  paintGround({ground:r0.ground,bus:sc.homeBus},4,sci*977+13);
  r0.arts.forEach((a,i)=>drawArt(a,i,ANCH[i].x,ANCH[i].y-152,0));
  const r=rng(sci*31+5);
  for(let k=0;k<9;k++){
    const a=r()*Math.PI*2, d=Math.sqrt(r());
    figure({x:CEN.x+Math.cos(a)*CEN.rx*d, y:CEN.y+Math.sin(a)*CEN.ry*d+10, s:1.3, moving:false, ph:0, shirt:SHIRTS[(k*5+sci)%SHIRTS.length], skin:SKIN[(k*2+sci)%SKIN.length],

function paintThumbs(){

}

function stage(){
  const r=R();
  switch(S.phase){
    case "situation": return situationView(r);
    case "form": return formPickView(r);
    case "vote": return voteView(r);
    case "result": return resultView(r);
    case "feel": return feelView(r);
    case "check": return checkView(r);
    case "event": return eventView(r);
  }
  return "";
}
/* Text passt immer ganz in das Feld: notfalls wird die Schrift stufenweise kleiner */
function fitPanel(){
  const pb=$("panel"); if(!pb || $("mainView").hidden || $("game").hidden) return;
  pb.classList.remove("scroll");
  let f=S.fs; pb.style.setProperty("--pfs", f);
  let guard=0;
  while(pb.scrollHeight > pb.clientHeight+1 && f>0.96 && guard++<20){ f=Math.max(0.953, Math.round((f-0.02)*1000)/1000); pb.style.setProperty("--pfs", f); }
  if(pb.scrollHeight > pb.clientHeight+1) pb.classList.add("scroll");
}
function replay(el,cls){ if(!el || reduced) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
let lastView="";
const FULL=["title","choose","how","hook"];
function render(){
  const focusId = document.activeElement && document.activeElement.id;
  const ur = S.screen==="urne", tv = S.screen==="teacher", gm=!ur&&!tv;
  $("game").hidden=!gm; $("urne").hidden=!ur; $("lehr").hidden=!tv; document.body.classList.toggle("game",gm);
  if(ur){ $("urne").innerHTML = urneView(); lastView="urne"; }
  else if(tv){
    $("lehr").innerHTML = lehrView(); lastView="teacher";
    paintThumbs();
  } else {
    $("game").style.setProperty("--fs", S.fs);
    $("tools").innerHTML = tools();
    const full = FULL.includes(S.screen), themed = S.screen!=="title" && S.screen!=="choose";
    $("brandSub").textContent = "Und wer bestimmt das?";
    $("fullView").hidden=!full; $("mainView").hidden=full;
    if(full){
      $("rt").innerHTML = `<p class="tb-step">${S.screen==="title"?"Willkommen":S.screen==="choose"?"Eure erste Entscheidung: <b>Welches Thema?</b>":"Gleich geht es los: <b>"+esc(SC().name)+"</b>"}</p>`;
      const fv=$("fullView"), view=S.screen+"|"+(S.screen==="how"?S.sc:"");
      fv.classList.remove("enter");
      fv.innerHTML = S.screen==="title" ? gameTitleView() : S.screen==="choose" ? chooseView() : S.screen==="how" ? howView() : hookView();
      if(view!==lastView) replay(fv,"enter");
      lastView=view;
      paintThumbs();
    } else {
      $("rt").innerHTML = route();
      $("hudBar").innerHTML = hudBar();
      const pb=$("panel");
      const view=S.screen+"|"+S.sc+"|"+S.round+"|"+S.phase+"|"+(S.v&&S.v.stage||"")+"|"+(S.v&&S.v.prop!=null?S.v.prop:"");
      pb.classList.remove("enter");
      pb.innerHTML = S.screen==="round" ? stage() : S.screen==="end" ? endView() : formsView();
      fitPanel();
      if(view!==lastView) replay(pb,"enter");
      lastView=view;

  if(focusId){ const el=$(focusId); if(el) el.focus({preventScroll:true}); }
}

let introBusy=false;
function playIntro(){
  if(introBusy) return;
  if(reduced){ S.screen="forms"; render(); return; }
  introBusy=true;
  const el=$("intro");
  const stars=Array.from({length:16},(_,i)=>{ const a=i/16*Math.PI*2+0.2, d=360+(i%3)*150;
    return `<i class="i-star" style="left:calc(50% - 11px);top:calc(55% - 11px);--dx:${Math.round(Math.cos(a)*d)}px;--dy:${Math.round(Math.sin(a)*d*0.62)}px;animation-delay:${(0.5+(i%4)*0.07).toFixed(2)}s"></i>`; }).join("");
  el.innerHTML = `<div class="i-wipe"></div>${stars}<div class="i-title"><div class="i-k">${esc(SC().name)}</div><div class="i-t">${esc(SC().title)}</div><div class="i-s">Vier Regeln · fünf Stationen · eine Klasse</div></div>`;
  el.classList.remove("out"); el.hidden=false;
  setTimeout(()=>{ S.screen="forms"; render(); }, 1300);
  setTimeout(()=>{ el.classList.add("out"); }, 2300);
  setTimeout(()=>{ el.hidden=true; el.innerHTML=""; el.classList.remove("out"); introBusy=false; }, 3050);
}
function clickFx(e,b){
  if(reduced) return;
  const box=$("fx"), gm=$("game"); if(!box || !gm) return;
  const rc=gm.getBoundingClientRect(), k=rc.width/1920 || 1;
  const x=(e.clientX-rc.left)/k, y=(e.clientY-rc.top)/k;
  if(!isFinite(x) || !isFinite(y)) return;
  const gold=b.classList.contains("gelb")||b.classList.contains("ccard");
  const cols=gold?["#FFC93C","#1E2140","#3A6FD8"]:["#1E2140","#FFC93C","#D9622B"];
  let h=`<i class="fxr" style="left:${x}px;top:${y}px;border-color:${cols[1]}"></i>`;
  for(let i=0;i<9;i++){ const a=i/9*Math.PI*2, d=34+(i%3)*14; h+=`<i class="fxd" style="left:${x}px;top:${y}px;background:${cols[i%3]};--dx:${Math.round(Math.cos(a)*d)}px;--dy:${Math.round(Math.sin(a)*d)}px"></i>`; }
  const wrap=document.createElement("div"); wrap.innerHTML=h; box.appendChild(wrap);
  setTimeout(()=>wrap.remove(), 650);
}

  S=fresh({sc:S.sc, mode:S.mode, n:S.n, groups:S.groups, fs:S.fs, allowed:S.allowed, planOn:S.planOn});
  S.budget=SC().money.start;
  hudPrev=null; W.scene=null; W.burstKey=""; W.bus.x=-220;
  makeFigures();
}
function stopCt(){ const t=S.ct; if(t.running){ t.elapsed+=(Date.now()-t.since)/1000; t.running=false; } }
function themeChosen(rand){
  stopCt();
  S.ent={easy:null, how:rand?"none":null, rand:!!rand};
  S.budget=SC().money.start; hudPrev=null; W.scene=null; W.burstKey=""; W.bus.x=-220;
  S.screen="how";
}
let spinning=false;
function spinRandom(){
  if(spinning) return;
  const al=allowedIdx(), pick=al[Math.floor(Math.random()*al.length)];
  if(reduced){ S.sc=pick; S.chosen=true; themeChosen(true); render(); return; }
  spinning=true;
  const L0=al.length, c0=Math.max(0,al.indexOf(S.chosen?S.sc:al[0])), p=al.indexOf(pick);
  const n=3*L0+((((p-c0-3*L0)%L0)+L0)%L0);
  let k=0, cur=c0;
  const tick=()=>{
    cur=(cur+1)%L0; k++;
    document.querySelectorAll(".ccard").forEach(el=>el.classList.toggle("spin", +el.dataset.ci===al[cur]));
    if(k<n){ setTimeout(tick, 70+k*k*2.2); }
    else { setTimeout(()=>{ spinning=false; S.sc=pick; S.chosen=true; themeChosen(true); render(); }, 700); }
  };
  document.querySelectorAll(".ccard").forEach(el=>el.classList.remove("on"));
  tick();
}
function act(a, d){
  const N=voters();
  if(a!=="pm" && !["scale","full","timer-toggle","timer-add","ct-toggle","ct-add","disc-toggle","disc-add","plan"].includes(a)) S.pm=false;
  switch(a){
    case "scale": S.fs = clamp(Math.round((S.fs + 0.1*(+d.d))*10)/10, 1, 1.3); break;
    case "pm": S.pm=!S.pm; render(); fitPanel(); return;
    case "full": {
      const el=document.documentElement;
      try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else if(el.requestFullscreen) el.requestFullscreen().catch(()=>{}); }catch(e){}
      return;
    }
    case "to-urne": S.prev=S.screen; S.screen="urne"; if(U.stage==="setup") U.n=voters(); try{ window.scrollTo(0,0); }catch(e){} break;
    case "from-urne": S.screen=S.prev||"teacher"; lastView=""; try{ window.scrollTo(0,0); }catch(e){} break;
    case "ask-reset": S.ask="reset"; break;
    case "ask-cancel": S.ask=null; break;
    case "restart": newGame(); try{ window.scrollTo(0,0); }catch(e){} break;
    case "allow": {
      const i=+d.i;
      if(S.allowed[i] && allowedIdx().length<=2){ S.allowErr=true; break; }
      S.allowed[i]=!S.allowed[i]; S.allowErr=false; break;
    }
    case "copy-set": {
      const btn=$("copySet");
      try{ navigator.clipboard.writeText(settingsLink()).then(()=>{ if(btn){ btn.textContent="Kopiert"; setTimeout(()=>{ if(btn.isConnected) btn.textContent="Link kopieren"; },1600); } }, ()=>{}); }catch(e){}
      return;
    }
    case "to-choose": S.screen="choose"; S.chosen=false; S.ct={total:120,elapsed:0,since:Date.now(),running:true,over:false}; break;
    case "ct-toggle": { const t=S.ct; if(t.running){ t.elapsed+=(Date.now()-t.since)/1000; t.running=false; } else { t.since=Date.now(); t.running=true; } break; }
    case "ct-add": S.ct.total+=60; S.ct.over=ctLeft()<=0; break;
    case "choose-sc": if(spinning) return; S.sc=clamp(+d.i,0,SCENARIOS.length-1); S.chosen=true; break;
    case "choose-ok": if(!S.chosen || spinning) return; themeChosen(false); break;
    case "rand": spinRandom(); return;
    case "ent-easy": S.ent.easy=d.v; break;
    case "ent-how": S.ent.how=d.v; break;
    case "to-hook": if(!S.ent.easy || !S.ent.how) return; S.screen="hook"; break;
    case "copy-link": {
      const txt=urneLink(), btn=$("copyBtn");
      const done=()=>{ if(btn){ btn.textContent="Kopiert"; setTimeout(()=>{ if(btn.isConnected) btn.textContent="Kopieren"; },1600); } };
      try{ navigator.clipboard.writeText(txt).then(done, ()=>{}); }catch(e){}
      return;
    }
    case "mode": S.mode=d.v; S.n = d.v==="gruppen" ? 4 : 24; makeGroups(); makeFigures(); break;
    case "setn": { const gr=S.mode==="gruppen"; S.n=clamp(S.n+(+d.d), gr?2:5, gr?8:32); makeGroups(); makeFigures(); break; }
    case "to-title": if(allowedIdx().length<2){ S.allowErr=true; break; } newGame(); S.sc=allowedIdx()[0]; S.screen="title"; S.t0=Date.now(); try{ window.scrollTo(0,0); }catch(e){} break;
    case "go": playIntro(); return;
    case "start-game": S.screen="round"; S.round=0; resetRound(); break;
    case "add-own": {
      const inp=$("own-text"); const t=(inp&&inp.value||"").trim();
      if(!t || S.extra.length>=1) return;
      S.extra.push(t.slice(0,40)); break;
    }
    case "del-own": S.extra.splice(+d.i,1); break;
    case "to-form": S.phase="form"; break;
    case "to-situation": S.phase="situation"; break;
    case "pick-form": pickForm(d.f); break;
    case "back-form": S.phase="form"; S.form=null; S.v=null; resetTimer(); break;
    case "step": {
      const t = d.scope==="feel" ? S.feel : S.v;
      const max=maxFor(d.key), lo = d.key==="k" ? 1 : 0;
      if(d.i!=="" && d.i!=null) t[d.key][+d.i] = clamp((t[d.key][+d.i]||0) + (+d.d), lo, max);
      else t[d.key] = clamp((t[d.key]||0) + (+d.d), lo, max);
      if(S.v){ S.v.err=null; if(S.form==="konsens") S.v.blocked=false; }
      break;
    }
    case "rep": { const i=+d.i, r=S.v.reps, p=r.indexOf(i); if(p>=0) r.splice(p,1); else if(r.length<N-1) r.push(i); break; }
    case "reps-ok": if(repCount()<1) return; S.v.stage="vote"; S.v.counts=zeros(opts().length); S.v.err=null; break;
    case "reps-back": S.v.stage="pick"; S.v.err=null; break;
    case "kons-pick": Object.assign(S.v,{prop:+d.i, blocked:false, zu:0, be:0, veto:0, err:null}); break;
    case "kons-change": Object.assign(S.v,{prop:null, blocked:false, zu:0, be:0, veto:0, err:null}); break;
    case "kons-retry": S.v.tries.push(S.v.prop); Object.assign(S.v,{prop:null, blocked:false, zu:0, be:0, veto:0, err:null}); break;
    case "eval": evaluate(); break;
    case "no-agree": finish({idx:R().fallback, none:true}); break;
    case "timer-toggle": { const t=S.timer; if(t.running){ t.elapsed=elapsed(); t.running=false; } else { t.since=Date.now(); t.running=true; } break; }
    case "timer-add": S.timer.total+=60; break;
    case "disc-toggle": { const t=S.disc; if(!t.started){ t.started=true; t.running=true; t.since=Date.now(); } else if(t.running){ t.elapsed+=(Date.now()-t.since)/1000; t.running=false; } else { t.since=Date.now(); t.running=true; } break; }
    case "disc-add": S.disc.total+=60; break;
    case "plan": S.planOn=!S.planOn; break;
    case "to-feel": S.phase="feel"; break;
    case "to-check": applyResult(); break;
    case "next": {
      const ev=SC().events[S.round];
      if(ev && !S.evDone){ S.budget+=ev.d; S.evDone=true; S.phase="event"; }
      else advance();
      break;
    }
    case "after-event": advance(); break;
    case "u-kind": U.kind=d.v; break;
    case "u-nopt": U.nOpt=clamp(U.nOpt+(+d.d),2,5); break;
    case "u-n": U.n=clamp(U.n+(+d.d),1,40); break;
    case "u-open": U.counts=zeros(uLabels().length); U.given=0; U.sel=null; U.wsel=Array(U.nOpt).fill(null); U.stage="vote"; break;
    case "u-pick": U.sel=+d.i; U.stage="confirm"; break;
    case "u-w": U.wsel[+d.i]=+d.v; break;
    case "u-wsubmit": if(!U.wsel.every(x=>x!=null)) return; U.stage="confirm"; break;
    case "u-change": U.stage="vote"; break;
    case "u-confirm":
      if(U.kind==="widerstand") U.wsel.forEach((p,i)=>{ U.counts[i]+=p; });
      else U.counts[U.sel]++;
      U.given++; U.sel=null; U.wsel=Array(U.nOpt).fill(null); U.stage="thanks"; break;
    case "u-next": U.stage = U.given>=U.n ? "thanks" : "vote"; break;
    case "u-reveal": U.stage="result"; break;
    case "u-setup": U.stage="setup"; break;
    default: return;
  }
  render();
}

function start(data){
  S = (data && data.S) || fresh({});
  U = (data && data.U) || freshUrne(24);
  let hash=""; try{ hash=location.hash||""; }catch(e){}
  if(!(data && data.S)){
    if(hash==="#urne"){ S.prev="teacher"; S.screen="urne"; }
    else if(hash.indexOf("t=")>=0){
      const q={}; hash.slice(1).split("&").forEach(p=>{ const k=p.split("="); q[k[0]]=decodeURIComponent(k[1]||""); });
      const t=(q.t||"").split(",").map(Number).filter(i=>i>=0 && i<SCENARIOS.length);
      if(t.length>=2) S.allowed=SCENARIOS.map((_,i)=>t.includes(i));
      if(q.m==="g"){ S.mode="gruppen"; S.n=clamp(parseInt(q.n,10)||4,2,8); makeGroups(); }
      else if(q.n){ S.n=clamp(parseInt(q.n,10)||24,5,32); }
    }
  }
  makeFigures();
  const onClick = e=>{ const b=e.target.closest("[data-act]"); if(!b || b.disabled) return; act(b.dataset.act, b.dataset); };
  const onChange = e=>{
    const el=e.target;
    if(!el.matches || !el.matches("input[data-key]")) return;
    let val=parseInt(el.value,10); if(isNaN(val)) val=0;
    const key=el.dataset.key, i=el.dataset.i;
    const t = el.dataset.scope==="feel" ? S.feel : S.v;
    if(!t) return;
    val=clamp(val, key==="k"?1:0, maxFor(key));
    if(i!=="" && i!=null) t[key][+i]=val; else t[key]=val;
    if(S.v){ S.v.err=null; if(S.form==="konsens") S.v.blocked=false; }
    render();
  };
  [$("game"),$("urne"),$("lehr")].forEach(root=>{ root.addEventListener("click",onClick); root.addEventListener("change",onChange); });
  $("game").addEventListener("pointerdown", e=>{ const b=e.target.closest(".btn,.team,button.opt,button.ticket,.stepper button,.ccard,.pick"); if(b && !b.disabled) clickFx(e,b); });
  $("game").addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="own-text"){ e.preventDefault(); act("add-own",{}); } });
  $("panel").addEventListener("toggle", ()=>fitPanel(), true);
  let holdT=null, holdEl=null;
  const cancel=()=>{ if(holdT){ clearTimeout(holdT); holdT=null; } if(holdEl){ holdEl.classList.remove("holding"); holdEl=null; } };
  const begin=h=>{ cancel(); holdEl=h; h.classList.add("holding"); holdT=setTimeout(()=>{ const a=h.dataset.hold; cancel(); act(a,{}); },1500); };
  $("urne").addEventListener("pointerdown", e=>{ const h=e.target.closest("[data-hold]"); if(h){ e.preventDefault(); begin(h); } });
  $("urne").addEventListener("keydown", e=>{ const h=e.target.closest && e.target.closest("[data-hold]"); if(h && (e.key==="Enter"||e.key===" ") && !e.repeat){ e.preventDefault(); begin(h); } });
  ["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,cancel));
  document.addEventListener("keyup", cancel);
  $("urne").addEventListener("contextmenu", e=>{ if(e.target.closest("[data-hold]")) e.preventDefault(); });

  setInterval(()=>{
    if(S.screen==="choose" && S.ct.running){
      const left=ctLeft(), v=$("ct-val");
      if(v) v.textContent=mmss(left);
      if(left<=0 && !S.ct.over){ S.ct.over=true; render(); }
      return;
    }
    if(S.screen!=="round") return;
    const disc = S.phase==="situation"||S.phase==="form";
    const t = disc ? S.disc : S.phase==="vote" ? S.timer : null;
    if(!t || !t.running) return;
    const left=tLeft(t);
    const v=$("timer-val"), p=$("timer-cell");
    if(v) v.textContent=mmss(left);
    if(p) p.classList.toggle("alarm", left<=0);
    if(disc && left<=0 && !t.over){ t.over=true; render(); }
  }, 250);

  setInterval(()=>{
    if(!S.planOn || !S.t0) return;
    const b=$("planBtn"), p=planInfo(); if(!b || !p) return;
    b.className="btn sm plan "+p.st; b.title="Seit Spielstart "+p.el+" Min. Antippen zum Ausblenden.";
    b.innerHTML=`<span class="pl1">${p.txt}</span><span class="pl2">${p.left} Min. bis Stundenende</span>`;
  }, 5000);

  window.addEventListener("resize", fit);
  document.addEventListener("fullscreenchange", ()=>setTimeout(fit,50));
  window.addEventListener("beforeunload", e=>{ if(S.screen==="round" || (U.stage!=="setup" && U.given>0)){ e.preventDefault(); e.returnValue=""; } });
  try{ window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(()=>({S,U})); }catch(e){}
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ W.ground=null; THUMBS.length=0; paintThumbs(); fitPanel(); });
  fit(); render();
  requestAnimationFrame(frame);
}
const hot = window.claude && window.claude.hot;
if(hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
